ground_segmentation:
  ros__parameters:
    n_threads: 4

    r_min: 0.2
    r_max: 50
    n_bins: 120
    n_segments: 360

    max_dist_to_line: 0.1

    sensor_height: 0.16
    min_slope: 0.0
    max_slope: 0.3
    max_fit_error: 0.05
    long_threshold: 1.0
    max_long_height: 0.1
    max_start_height: 0.2
    line_search_angle: 0.1

    gravity_aligned_frame: ""

    latch: false
    visualize: false

    input_topic: "livox/lidar"
    obstacle_output_topic: "segmentation/obstacle"
    ground_output_topic: "segmentation/ground"
